allowBuilds:
  esbuild: true

minimumReleaseAgeStrict: true
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@effect/*"
  - "@storybook/*"
  - "@storybook/addon-vitest"
  - effect
  - kysely
  - storybook

catalog:
  "@vitest/coverage-v8": 5.0.5
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

overrides:
  uuid: ^14.0.3
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-start':
    skills: true
