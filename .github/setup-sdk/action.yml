name: setup-sdk
description: >-
  Reusable setup for the project toolchain: Node.js, pnpm, and Vite+ (vp).
  Installs vp, selects Node.js via `vp env use`, and exposes a managed
  `pnpm` command in CI.

inputs:
  node-version:
    description: Node.js version to select via `vp env use`
    required: false
    default: "24"
  version:
    description: >-
      Vite+ version to install. When empty, it is auto-resolved from the
      `vite-plus` entry in package.json / the lockfile.
    required: false
  cache:
    description: Enable caching of project dependencies (lockfile auto-detected)
    required: false
    default: "true"
  run-install:
    description: Run `vp install` after setup
    required: false
    default: "true"
  working-directory:
    description: Project directory used for lockfile detection and default install
    required: false

outputs:
  vp-version:
    description: Installed Vite+ version
    value: ${{ steps.setup.outputs.version }}
  node-version:
    description: Node.js version resolved by Vite+
    value: ${{ steps.setup.outputs.node-version }}
  package-manager:
    description: Package manager resolved by Vite+ (e.g. pnpm)
    value: ${{ steps.setup.outputs.package-manager }}
  package-manager-version:
    description: Version of the resolved package manager
    value: ${{ steps.setup.outputs.package-manager-version }}
  cache-hit:
    description: Whether the dependency cache was restored
    value: ${{ steps.setup.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: setup
      uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version: ${{ inputs.node-version }}
        version: ${{ inputs.version }}
        cache: ${{ inputs.cache }}
        run-install: ${{ inputs.run-install }}
        working-directory: ${{ inputs.working-directory }}
