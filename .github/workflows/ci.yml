name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm check

      - name: Types (TypeScript and Marko)
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Browser tests
        run: pnpm e2e:install && pnpm e2e --project Chromium

      - name: .env.example is current
        run: pnpm app config:generate --check

      - name: The API description is current
        run: pnpm app openapi:generate --check

      - name: Build the Node server
        run: pnpm build

      - name: Build the Worker
        run: pnpm build --mode worker --minify
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
