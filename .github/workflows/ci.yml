name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Verify and Test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-sdk
        with:
          node-version: 24.22.0
          cache: true

      - name: Build the application
        run: vp run build

      - name: Format and lint
        run: vp run check

      - name: Typecheck
        run: vp run typecheck

      - name: .env.example is current
        run: |
          vp run app generate:config
          vp run app generate:config --check

      - name: Unit tests
        run: vp run test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright
        run: vp exec playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: vp run e2e --project Chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .output/e2e-result
          retention-days: 14

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: Build (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-sdk
        with:
          node-version: 24.22.0
          cache: true

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build:standalone
