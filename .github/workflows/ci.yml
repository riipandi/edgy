name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-sdk
        with:
          node-version: 24.22.0
          cache: true

      - name: Format and lint
        run: vp run check

      - name: Typecheck
        run: vp run typecheck

      - name: Unit tests
        run: vp run test

      # - name: Browser tests
      #   run: |
      #     vp run e2e:install
      #     vp run e2e --project Chromium

      # - name: .env.example is current
      #   run: vp run app config:generate --check

      # - name: The API description is current
      #   run: vp run app openapi:generate --check

      - name: Build the application
        run: vp run build
